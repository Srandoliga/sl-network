# Build + kontrola při každém pushi. Veřejné nasazení na GitHub Pages je ZATÍM jen ruční
# (Actions → „Build a nasazení“ → Run workflow) a smí proběhnout až po schválení majitelem.
# Po schválení lze nasazení zapnout i pro push: v jobu deploy smazat řádek `if:`.
# Plánované vydání (schválené majitelem): jednorázově 28. 10. 2026 v 19:15 SEČ = 18:15 UTC (Beyond the Score).
# Článek má datum 19:15 a veřejný build ho do té doby vynechá, takže dřívější ruční nasazení ho nezveřejní.
# GitHub plánovač bývá zpožděný (20. 10. o 26 min, 25. 10. o 35 min). Po vydání trigger `schedule` smazat.
name: Build a nasazení

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 18 28 10 *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      scheduled-ok: ${{ steps.gate.outputs.ok }}
    steps:
      # Pojistka: plánované nasazení platí jen pro rok 2026 (cron by se jinak opakoval každý 20. 10.).
      - id: gate
        run: echo "ok=$([ "$(date -u +%Y)" = 2026 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm test
      - name: Build (validace dat + kontrola odkazů)
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path || '/' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && needs.build.outputs.scheduled-ok == 'true')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
